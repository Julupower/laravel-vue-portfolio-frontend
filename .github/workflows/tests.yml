name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  vitest-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20;
          cache: 'npm';

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps;

      - name: Run Vitest Suite
        run: npm run test:unit;